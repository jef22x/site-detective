{% extends "base.html" %}
{% import "_components.html" as c %}
{% block header %}<span id="page-title">New Test</span>{% endblock %}
{% block content %}
<div class="mb-4 flex justify-end">
  <a href="{{ '/tests/' + test_id if test_id else '/tests' }}" class="{{ c.muted() }} hover:underline">&larr; Back</a>
</div>

<!-- Header fields -->
<section class="{{ c.section_cls() }} mb-4 p-6">
  <div class="grid gap-4 md:grid-cols-2">
    <div>
      <label class="{{ c.label_cls() }} mb-1">Name <span class="text-danger-600 dark:text-danger-400">*</span></label>
      <input id="f-name" type="text" maxlength="120" class="{{ c.input_cls() }} w-full"
             placeholder="e.g. Checkout smoke test">
      <p class="err mt-1 hidden text-xs text-danger-600 dark:text-danger-400" data-err="name"></p>
    </div>
    <div>
      <label class="{{ c.label_cls() }} mb-1">ID</label>
      <input id="f-id" type="text" class="{{ c.input_cls() }} w-full font-mono"
             placeholder="auto-generated-from-name">
      <p class="err mt-1 hidden text-xs text-danger-600 dark:text-danger-400" data-err="id"></p>
    </div>
    <div class="md:col-span-2">
      <label class="{{ c.label_cls() }} mb-1">Description</label>
      <textarea id="f-description" rows="2" class="{{ c.input_cls() }} w-full"></textarea>
    </div>
    <div class="md:col-span-2">
      <label class="{{ c.label_cls() }} mb-1">Starting URL</label>
      <input id="f-starting-url" type="text" class="{{ c.input_cls() }} w-full"
             placeholder="Leave empty to use the global default from Settings">
      <p class="mt-1 text-xs {{ c.muted() }}">Every run opens this page first, so a leading “Go to URL” step isn't needed.</p>
    </div>
  </div>
  <details class="mt-3">
    <summary class="cursor-pointer select-none text-sm {{ c.muted() }}">Advanced defaults</summary>
    <div class="mt-3 grid gap-4 md:grid-cols-3">
      <div>
        <label class="{{ c.label_cls() }} mb-1">Default timeout (ms)</label>
        <input id="f-timeout" type="number" min="100" value="10000" class="{{ c.input_cls() }} w-full">
      </div>
      <div>
        <label class="{{ c.label_cls() }} mb-1">Default retries</label>
        <input id="f-retries" type="number" min="0" value="1" class="{{ c.input_cls() }} w-full">
      </div>
      <div class="flex items-end pb-2">
        <label class="inline-flex items-center gap-2 text-sm">
          <input id="f-healing" type="checkbox" checked class="size-4 rounded accent-primary-600"> Healing enabled
        </label>
      </div>
    </div>
  </details>
</section>

<!-- Steps -->
<section class="mb-24">
  <h2 class="mb-2 text-base font-semibold">Steps</h2>
  <div id="steps"></div>
  <div id="empty-steps" class="hidden rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center {{ c.muted() }} dark:border-white/20 dark:bg-gray-900">
    No steps yet — add your first step.
  </div>
  <button onclick="addStep()" class="{{ c.btn_primary() }} mt-3">+ Add Step</button>
</section>

<!-- Sticky save bar -->
<div class="fixed bottom-0 left-0 right-0 bg-white/80 ring-1 ring-gray-950/5 backdrop-blur lg:left-64 dark:bg-gray-900/80 dark:ring-white/10">
  <div class="mx-auto flex max-w-7xl items-center gap-3 px-6 py-3">
    <button id="btn-save" onclick="saveTest(false)"
      class="{{ c.btn_primary() }}">Save Test</button>
    <button id="btn-save-run" onclick="saveTest(true)"
      class="{{ c.btn_success() }}">Save &amp; Run</button>
    <span id="save-status" class="text-sm {{ c.muted() }}"></span>
  </div>
</div>

<div id="toast" class="hidden fixed bottom-20 right-6 {{ c.toast_ok() }}"></div>

<script>
const MODE = "{{ mode }}";                       // "new" | "edit"
const INITIAL = {{ test_json | safe }};          // TestDefinition or null

const TYPES = {
  navigate:       {label: 'Go to URL',              fields: ['url']},
  click:          {label: 'Click element',          fields: ['intent', 'selector', 'context']},
  type:           {label: 'Type text',              fields: ['intent', 'selector', 'value', 'clear_first']},
  select:         {label: 'Select dropdown option', fields: ['intent', 'selector', 'value']},
  wait:           {label: 'Wait for condition',     fields: ['condition', 'intent', 'selector', 'timeout_ms']},
  assert_element: {label: 'Check element',          fields: ['intent', 'selector', 'exists', 'text_contains']},
  screenshot:     {label: 'Take screenshot',        fields: ['label', 'full_page']},
  login:          {label: 'Log in',                 fields: ['context']},
};
const REQUIRED = {navigate: ['url'], type: ['value'], select: ['value'], screenshot: ['label']};
const VAR_FIELDS = new Set(['url', 'value', 'selector']);
const FIELD_LABELS = {
  url: 'URL', intent: 'Describe this element in plain English', selector: 'CSS selector',
  value: 'Value', clear_first: 'Clear field first', condition: 'Condition',
  exists: 'Element should exist', text_contains: 'Text contains', label: 'Screenshot label',
  full_page: 'Capture whole page',
  context: 'Browser context', timeout_ms: 'Timeout (ms)',
};

// steps carry a UI-only `_open` flag, stripped on save
let steps = [];
let dirty = false;
let idTouched = MODE === 'edit';

if (INITIAL) {
  const t = INITIAL.test;
  document.getElementById('f-name').value = t.name || '';
  document.getElementById('f-id').value = t.id;
  document.getElementById('f-id').readOnly = true;
  document.getElementById('f-id').classList.add('opacity-60');
  document.getElementById('f-description').value = t.description || '';
  document.getElementById('f-starting-url').value = t.starting_url || '';
  const d = t.defaults || {};
  if (d.timeout_ms != null) document.getElementById('f-timeout').value = d.timeout_ms;
  if (d.retries != null) document.getElementById('f-retries').value = d.retries;
  document.getElementById('f-healing').checked = d.healing !== false;
  steps = (t.steps || []).map(s => ({...s, _open: false}));
  document.getElementById('page-title').textContent = `Edit test: ${t.name || t.id}`;
}

function markDirty() { dirty = true; }
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

document.getElementById('f-name').addEventListener('input', e => {
  markDirty();
  if (!idTouched) document.getElementById('f-id').value = slugify(e.target.value);
});
document.getElementById('f-id').addEventListener('input', () => { idTouched = true; markDirty(); });
['f-description', 'f-starting-url', 'f-timeout', 'f-retries', 'f-healing'].forEach(id =>
  document.getElementById(id).addEventListener('input', markDirty));

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- step rendering ----------

function stepSummary(s) {
  const label = TYPES[s.type].label;
  const hint = s.intent || s.url || s.label || s.selector || '';
  return hint ? `${label} — “${hint}”` : label;
}

function fieldHtml(i, s, f) {
  const v = s[f];
  if (f === 'clear_first' || f === 'exists' || f === 'full_page') {
    const checked = (f === 'exists' ? v !== false : !!v) ? 'checked' : '';
    return `<label class="inline-flex items-center gap-2 text-sm mt-2 mr-4">
      <input type="checkbox" ${checked} onchange="setField(${i},'${f}',this.checked); rerenderCard(${i})" class="w-4 h-4">
      ${FIELD_LABELS[f]}</label>`;
  }
  if (f === 'condition' || f === 'context') {
    const opts = f === 'condition' ? ['visible', 'hidden', 'navigation', 'delay'] : ['customer', 'admin'];
    const cur = v || opts[0];
    return `<div class="mt-2"><label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">${FIELD_LABELS[f]}</label>
      <select onchange="setField(${i},'${f}',this.value); rerenderCard(${i})"
        class="{{ c.input_cls() }}">
        ${opts.map(o => `<option ${o === cur ? 'selected' : ''}>${o}</option>`).join('')}
      </select></div>`;
  }
  if (f === 'timeout_ms') {
    return `<div class="mt-2"><label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">${FIELD_LABELS[f]}</label>
      <input type="number" min="100" value="${v ?? ''}" placeholder="default"
        oninput="setField(${i},'${f}',this.value ? +this.value : null)"
        class="w-40 {{ c.input_cls() }}"></div>`;
  }
  // hide selector/intent for wait conditions that don't use them
  if (s.type === 'wait' && (f === 'selector' || f === 'intent') &&
      (s.condition === 'navigation' || s.condition === 'delay')) return '';
  const req = (REQUIRED[s.type] || []).includes(f) ||
              (f === 'intent' && !!s.selector);
  const varHint = VAR_FIELDS.has(f)
    ? ' <span class="text-xs bg-gray-100 ring-1 ring-gray-950/5 dark:bg-white/5 dark:ring-white/10 rounded px-1" title="Supports config placeholders like {{ '{{' }}starting_url{{ '}}' }}">{ } vars ok</span>' : '';
  const ph = f === 'intent' ? 'e.g. The Add to Cart button on the product page' : '';
  return `<div class="mt-2"><label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
      ${FIELD_LABELS[f]}${req ? ' <span class="text-danger-600 dark:text-danger-400">*</span>' : ''}${varHint}</label>
    <input type="text" value="${esc(v)}" placeholder="${ph}"
      oninput="setField(${i},'${f}',this.value)"
      class="w-full {{ c.input_cls() }} ${f === 'selector' ? 'font-mono' : ''}"
      data-field="${i}:${f}">
    <p class="err text-xs text-danger-600 dark:text-danger-400 mt-1 hidden" data-err="${i}:${f}"></p>
    ${f === 'intent' ? `<p class="warn text-xs text-warning-600 dark:text-warning-400 mt-1 hidden" data-warn="${i}:intent"></p>` : ''}
    </div>`;
}

function cardHtml(s, i) {
  const open = s._open;
  const body = !open ? '' : `
    <div class="px-4 pb-4">
      <div class="mt-2"><label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Step type</label>
        <select onchange="changeType(${i}, this.value)" class="{{ c.input_cls() }}">
          ${Object.entries(TYPES).map(([k, t]) =>
            `<option value="${k}" ${k === s.type ? 'selected' : ''}>${t.label}</option>`).join('')}
        </select></div>
      ${TYPES[s.type].fields.map(f => fieldHtml(i, s, f)).join('')}
      <details class="mt-3">
        <summary class="text-xs text-gray-500 dark:text-gray-400 cursor-pointer select-none">Advanced</summary>
        <div class="flex gap-4 flex-wrap">
          ${!TYPES[s.type].fields.includes('timeout_ms') ? fieldHtml(i, s, 'timeout_ms') : ''}
          <div class="mt-2"><label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Retries</label>
            <input type="number" min="0" value="${s.retries ?? ''}" placeholder="default"
              oninput="setField(${i},'retries',this.value ? +this.value : null)"
              class="w-28 {{ c.input_cls() }}"></div>
          <div class="mt-2"><label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Capture as</label>
            <input type="text" value="${esc(s.capture_as)}"
              oninput="setField(${i},'capture_as',this.value || null)"
              class="w-40 {{ c.input_cls() }} font-mono"></div>
        </div>
      </details>
    </div>`;
  return `
  <div class="step-card {{ c.section_cls() }} mb-2" draggable="true" data-index="${i}">
    <div class="flex items-center gap-2 px-3 py-2 ${open ? 'border-b border-gray-200 dark:border-white/10' : ''}">
      <span class="drag-handle cursor-grab text-gray-400 dark:text-gray-500 select-none" title="Drag to reorder">⠿</span>
      <span class="text-gray-400 dark:text-gray-500 text-sm w-6 font-mono">${i + 1}.</span>
      <button onclick="toggleStep(${i})" class="flex-1 text-left text-sm hover:text-primary-600 dark:hover:text-primary-400 truncate">
        ${esc(stepSummary(s))}</button>
      <p class="err text-xs text-danger-600 dark:text-danger-400 hidden" data-err="${i}:_card">has errors</p>
      <button onclick="duplicateStep(${i})" class="text-gray-500 hover:text-gray-950 dark:text-gray-400 dark:hover:text-white text-sm" title="Duplicate">⧉</button>
      <button onclick="removeStep(${i})" class="text-danger-600 dark:text-danger-400 hover:opacity-75 text-sm" title="Delete">✕</button>
    </div>
    ${body}
  </div>
  <div class="insert-slot h-2 group relative" data-insert="${i + 1}">
    <button onclick="addStep(${i + 1})" title="Insert step here"
      class="hidden group-hover:block absolute left-1/2 -translate-x-1/2 -top-2 bg-gray-100 ring-1 ring-gray-950/10 hover:bg-primary-600 hover:text-white text-gray-600 dark:bg-white/10 dark:ring-white/20 dark:text-gray-300 rounded-full w-5 h-5 text-xs leading-5">+</button>
  </div>`;
}

function render() {
  const box = document.getElementById('steps');
  box.innerHTML = steps.map(cardHtml).join('');
  document.getElementById('empty-steps').classList.toggle('hidden', steps.length > 0);
  wireDrag();
}
function rerenderCard(i) { render(); }  // simple + safe: full rerender on structural field change

function setField(i, f, v) {
  steps[i][f] = v === '' ? null : v;
  markDirty();
  if (f === 'intent' || f === 'url' || f === 'label' || f === 'selector') {
    // update summary text lazily on next render; no live rerender to keep focus
  }
}
function changeType(i, t) {
  const keep = {_open: true, type: t};
  // preserve fields shared with the new type
  for (const f of TYPES[t].fields) if (steps[i][f] != null) keep[f] = steps[i][f];
  steps[i] = keep;
  markDirty(); render();
}
function addStep(at) {
  const s = {type: 'click', _open: true};
  if (at == null) at = steps.length;
  steps.splice(at, 0, s);
  markDirty(); render();
  document.querySelectorAll('.step-card')[at]?.scrollIntoView({block: 'center', behavior: 'smooth'});
}
function duplicateStep(i) {
  steps.splice(i + 1, 0, {...steps[i], _open: false});
  markDirty(); render();
}
function removeStep(i) { steps.splice(i, 1); markDirty(); render(); }
function toggleStep(i) { steps[i]._open = !steps[i]._open; render(); }

// ---------- drag & drop reorder ----------
let dragFrom = null;
function wireDrag() {
  document.querySelectorAll('.step-card').forEach(card => {
    card.addEventListener('dragstart', e => { dragFrom = +card.dataset.index; e.dataTransfer.effectAllowed = 'move'; });
    card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('ring-2', 'ring-primary-500'); });
    card.addEventListener('dragleave', () => card.classList.remove('ring-2', 'ring-primary-500'));
    card.addEventListener('drop', e => {
      e.preventDefault();
      const to = +card.dataset.index;
      if (dragFrom === null || dragFrom === to) return;
      const [moved] = steps.splice(dragFrom, 1);
      steps.splice(to, 0, moved);
      dragFrom = null; markDirty(); render();
    });
  });
}

// ---------- validation & save ----------

function validate() {
  const errors = [];
  const name = document.getElementById('f-name').value.trim();
  const id = document.getElementById('f-id').value.trim();
  if (!name) errors.push({key: 'name', msg: 'Name is required.'});
  if (!id) errors.push({key: 'id', msg: 'ID is required.'});
  else if (!/^[a-z0-9-]+$/.test(id)) errors.push({key: 'id', msg: 'Only lowercase letters, digits and dashes.'});
  if (!steps.length) errors.push({key: null, msg: 'Add at least one step.'});
  steps.forEach((s, i) => {
    for (const f of REQUIRED[s.type] || [])
      if (!s[f]) errors.push({key: `${i}:${f}`, msg: 'Required.', step: i});
    if (s.selector && !s.intent &&
        !(s.type === 'wait' && (s.condition === 'navigation' || s.condition === 'delay')))
      errors.push({key: `${i}:intent`, msg: 'Required when a selector is set.', step: i});
  });
  // paint
  document.querySelectorAll('.err').forEach(el => { el.classList.add('hidden'); el.textContent = el.dataset.err.endsWith('_card') ? 'has errors' : ''; });
  for (const e of errors) {
    if (e.step != null && !steps[e.step]._open) {
      const badge = document.querySelector(`[data-err="${e.step}:_card"]`);
      if (badge) badge.classList.remove('hidden');
    }
    const el = document.querySelector(`[data-err="${CSS.escape(e.key ?? '')}"]`);
    if (el) { el.textContent = e.msg; el.classList.remove('hidden'); }
  }
  return errors;
}

// Non-blocking save-time lint (spec: docs/spec-healing-tiers.md §8): a weak
// intent (short, no quoted text) can't drive Tier 1's deterministic healing.
function lintWarnings() {
  const warnings = [];
  steps.forEach((s, i) => {
    if (!s.selector || !s.intent) return;
    const wordCount = s.intent.trim().split(/\s+/).filter(Boolean).length;
    const hasQuote = /['"][^'"]{3,}['"]/.test(s.intent);
    if (wordCount < 4 && !hasQuote) {
      warnings.push({
        step: i,
        msg: "Weak intent: quote the element's visible text (e.g. intent: "
            + "the 'Add to cart' button) to enable deterministic healing.",
      });
    }
  });
  return warnings;
}

function paintLintWarnings(warnings) {
  document.querySelectorAll('.warn').forEach(el => { el.classList.add('hidden'); el.textContent = ''; });
  for (const w of warnings) {
    const el = document.querySelector(`[data-warn="${w.step}:intent"]`);
    if (el) { el.textContent = w.msg; el.classList.remove('hidden'); }
  }
}

function buildPayload() {
  const cleanSteps = steps.map(s => {
    const out = {type: s.type};
    const fields = [...TYPES[s.type].fields, 'timeout_ms', 'retries', 'capture_as'];
    for (const f of fields) {
      let v = s[f];
      if (v === null || v === undefined || v === '') continue;
      if (f === 'exists' && v === true) { out[f] = true; continue; }
      out[f] = v;
    }
    if (s.type === 'assert_element') out.exists = s.exists !== false;
    return out;
  });
  return {
    schema_version: 1,
    test: {
      id: document.getElementById('f-id').value.trim(),
      name: document.getElementById('f-name').value.trim(),
      description: document.getElementById('f-description').value.trim(),
      starting_url: document.getElementById('f-starting-url').value.trim() || null,
      defaults: {
        timeout_ms: +document.getElementById('f-timeout').value || 10000,
        retries: Math.max(0, +document.getElementById('f-retries').value || 0),
        healing: document.getElementById('f-healing').checked,
      },
      steps: cleanSteps,
    },
  };
}

const TOAST_OK = '{{ c.toast_ok() }}';
const TOAST_ERR = '{{ c.toast_ok() }} text-danger-600 dark:text-danger-400';
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = (isError ? '✕ ' : '✓ ') + msg;
  el.className = 'fixed bottom-20 right-6 ' + (isError ? TOAST_ERR : TOAST_OK);
  setTimeout(() => el.classList.add('hidden'), 4000);
}

async function saveTest(andRun) {
  const errors = validate();
  if (errors.length) {
    toast(errors[0].msg + (errors.length > 1 ? ` (+${errors.length - 1} more)` : ''), true);
    const firstStep = errors.find(e => e.step != null);
    if (firstStep != null && !steps[firstStep.step]._open) { steps[firstStep.step]._open = true; render(); }
    return;
  }
  const warnings = lintWarnings();
  paintLintWarnings(warnings);
  if (warnings.length) {
    toast(warnings[0].msg + (warnings.length > 1 ? ` (+${warnings.length - 1} more)` : ''), false);
  }
  const payload = buildPayload();
  const isNew = MODE === 'new' && !window._savedOnce;
  const url = isNew ? '/api/tests' : `/api/tests/${payload.test.id}`;
  try {
    const r = await fetch(url, {
      method: isNew ? 'POST' : 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      const detail = (await r.json()).detail;
      throw new Error(typeof detail === 'string' ? detail
        : detail.map(d => `${(d.loc || []).join('.')}: ${d.msg}`).join('; '));
    }
    window._savedOnce = true;
    dirty = false;
    document.getElementById('f-id').readOnly = true;
    document.getElementById('f-id').classList.add('opacity-60');
    document.getElementById('save-status').textContent =
      `Saved at ${new Date().toLocaleTimeString()}`;

    toast('Test saved');
    if (andRun) {
      const rr = await fetch(`/api/tests/${payload.test.id}/run`, {method: 'POST'});
      if (!rr.ok) throw new Error((await rr.json()).detail || rr.statusText);
      const runData = await rr.json();
      location.href = `/runs/${runData.run_id}`;
      return;
    }
  } catch (e) { toast(e.message, true); }
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveTest(false); }
});

render();
if (MODE === 'new' && steps.length === 0) addStep();
</script>
{% endblock %}
