{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-bold mb-3">Edit test: {{ name }}</h1>
{% if error %}
<div class="bg-red-50 border border-red-300 text-red-700 rounded p-3 mb-3 text-sm whitespace-pre-wrap">{{ error }}</div>
{% elif request.method == 'POST' %}
<div class="bg-green-50 border border-green-300 text-green-700 rounded p-3 mb-3 text-sm">Saved.</div>
{% endif %}
<form method="post">
  <textarea name="content" rows="30" spellcheck="false"
    class="w-full font-mono text-sm border border-slate-300 rounded p-3">{{ content }}</textarea>
  <button class="mt-3 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Validate &amp; Save</button>
  <a href="/" class="ml-3 text-slate-500 hover:underline">Back</a>
</form>
{% endblock %}
