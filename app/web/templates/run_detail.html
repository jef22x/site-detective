{% extends "base.html" %}
{% block content %}
<div id="run-body" data-run-id="{{ run.id }}">
{% include "run_detail_body.html" %}
</div>

<script>
(function() {
  const runId = "{{ run.id }}";
  let terminal = {{ 'true' if run.status not in ('running',) else 'false' }};
  let lastSteps = -1, lastHealings = -1, lastStatus = null;
  if (terminal) return;  // nothing to poll for an already-finished run

  function openSections() {
    // Remember which <details> are open (by step index + section kind) so a
    // fragment swap doesn't collapse something the user just opened.
    const open = new Set();
    document.querySelectorAll('#run-body [data-step]').forEach(card => {
      const idx = card.dataset.step;
      card.querySelectorAll('details[open]').forEach(d => {
        open.add(`${idx}:${d.dataset.section || ''}`);
      });
    });
    return open;
  }
  function restoreSections(open) {
    document.querySelectorAll('#run-body [data-step]').forEach(card => {
      const idx = card.dataset.step;
      card.querySelectorAll('details').forEach(d => {
        if (open.has(`${idx}:${d.dataset.section || ''}`)) d.open = true;
      });
    });
  }

  async function refreshFragment() {
    const open = openSections();
    const r = await fetch(`/runs/${runId}/fragment`);
    if (!r.ok) return;
    document.getElementById('run-body').innerHTML = await r.text();
    restoreSections(open);
  }

  async function tick() {
    try {
      const r = await fetch(`/api/runs/${runId}/live`);
      if (!r.ok) { terminal = true; return; }  // run vanished; stop politely
      const live = await r.json();
      const changed = live.steps_rendered !== lastSteps ||
                      live.healings !== lastHealings ||
                      live.status !== lastStatus;
      lastSteps = live.steps_rendered; lastHealings = live.healings; lastStatus = live.status;
      if (changed) await refreshFragment();
      if (live.status !== 'running') {
        terminal = true;
        location.reload();  // final reload: duration, report link, header pill
        return;
      }
    } catch (e) { /* transient network hiccup: try again next tick */ }
    if (!terminal) setTimeout(tick, 1000);
  }
  tick();
})();
</script>
{% endblock %}
