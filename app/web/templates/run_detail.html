{% extends "base.html" %}
{% import "_components.html" as c %}
{% block header %}Run detail{% endblock %}
{% block content %}
<div id="run-body" data-run-id="{{ run.id }}" data-status="{{ run.status }}">
{% include "run_detail_body.html" %}
</div>
{# Lives outside #run-body so a fragment swap never wipes a visible toast. #}
<div id="toast" class="hidden fixed bottom-6 right-6 {{ c.toast_ok() }}"></div>

<script>
const TOAST_OK = '{{ c.toast_ok() }}';
const TOAST_ERR = '{{ c.toast_ok() }} text-danger-600 dark:text-danger-400';
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'fixed bottom-6 right-6 ' + (isError ? TOAST_ERR : TOAST_OK);
  setTimeout(() => el.classList.add('hidden'), 4000);
}
// Global (not inside the polling IIFE below, which returns early for finished
// runs) because the button's inline onclick lives in the swappable fragment.
async function rerunTest(btn, testId) {
  btn.disabled = true;
  try {
    const r = await fetch(`/api/tests/${encodeURIComponent(testId)}/run`, {method: 'POST'});
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const data = await r.json();
    location.href = `/runs/${encodeURIComponent(data.run_id)}`;
  } catch (e) { toast(e.message, true); btn.disabled = false; }
}

(function() {
  // Templated values ride in on #run-body's data-* attributes: Jinja in a JS
  // expression slot leaves this script unparseable for editors and linters.
  const body = document.getElementById('run-body');
  const runId = body.dataset.runId;
  let terminal = body.dataset.status !== 'running';
  let lastSteps = -1, lastHealings = -1, lastStatus = null;
  if (terminal) return;  // nothing to poll for an already-finished run

  function openSections() {
    // Remember which <details> are open (by step index + section kind) so a
    // fragment swap doesn't collapse something the user just opened.
    const open = new Set();
    document.querySelectorAll('#run-body [data-step]').forEach(card => {
      const idx = card.dataset.step;
      card.querySelectorAll('details[open]').forEach(d => {
        open.add(`${idx}:${d.dataset.section || ''}`);
      });
    });
    return open;
  }
  function restoreSections(open) {
    document.querySelectorAll('#run-body [data-step]').forEach(card => {
      const idx = card.dataset.step;
      card.querySelectorAll('details').forEach(d => {
        if (open.has(`${idx}:${d.dataset.section || ''}`)) d.open = true;
      });
    });
  }

  async function refreshFragment() {
    const open = openSections();
    const r = await fetch(`/runs/${runId}/fragment`);
    if (!r.ok) return;
    document.getElementById('run-body').innerHTML = await r.text();
    restoreSections(open);
  }

  async function tick() {
    try {
      const r = await fetch(`/api/runs/${runId}/live`);
      if (!r.ok) { terminal = true; return; }  // run vanished; stop politely
      const live = await r.json();
      const changed = live.steps_rendered !== lastSteps ||
                      live.healings !== lastHealings ||
                      live.status !== lastStatus;
      lastSteps = live.steps_rendered; lastHealings = live.healings; lastStatus = live.status;
      if (changed) await refreshFragment();
      if (live.status !== 'running') {
        terminal = true;
        location.reload();  // final reload: duration, report link, header pill
        return;
      }
    } catch (e) { /* transient network hiccup: try again next tick */ }
    if (!terminal) setTimeout(tick, 1000);
  }
  tick();
})();
</script>
{% endblock %}
