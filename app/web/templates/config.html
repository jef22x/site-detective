{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-bold mb-3">Configuration</h1>
{% if error %}
<div class="bg-red-50 border border-red-300 text-red-700 rounded p-3 mb-3 text-sm whitespace-pre-wrap">{{ error }}</div>
{% endif %}
<div class="grid md:grid-cols-2 gap-6">
  <section>
    <h2 class="font-semibold mb-2">Current (secrets masked)</h2>
    <pre class="bg-white border border-slate-200 rounded p-3 text-sm">{{ masked }}</pre>
  </section>
  <section>
    <h2 class="font-semibold mb-2">Edit raw settings.yaml</h2>
    <form method="post">
      <textarea name="content" rows="18" spellcheck="false"
        class="w-full font-mono text-sm border border-slate-300 rounded p-3">{{ content }}</textarea>
      <button class="mt-3 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Save</button>
    </form>
  </section>
</div>
{% endblock %}
