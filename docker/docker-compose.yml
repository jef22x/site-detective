# WordPress + WooCommerce + Mailpit staging stack (spec 10.4).
# Usage: docker compose up -d && ./provision.sh
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes: [db_data:/var/lib/mysql]

  wordpress:
    image: wordpress:php8.3
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      # Route wp_mail() to Mailpit via the WP Mail SMTP config in provision.sh
    volumes: [wp_data:/var/www/html]

  wpcli:
    image: wordpress:cli-php8.3
    depends_on: [wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes: [wp_data:/var/www/html]
    entrypoint: ["tail", "-f", "/dev/null"]  # kept alive for provision.sh exec

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

volumes:
  db_data:
  wp_data:
