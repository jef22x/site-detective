# SiteDetective configuration (spec F-2). Secrets are masked in UI/logs.
starting_url: "http://127.0.0.1:8899"   # the default site to run your tests; point at your staging site
admin_user: "admin"
admin_password: "changeme"
product_id: "123"
purchases_per_run: 1
max_concurrent_runs: 3   # 1-10 tests may run at the same time (restart to apply)
stripe_publishable_key: ""
stripe_secret_key: ""

ollama:
  enabled: true
  url: "http://localhost:11434"
  model: "gemma4-coding:latest"  # healing model; any installed Ollama model
  num_ctx: 65536          # context window requested per healing call; drives HTML chunk size
  # chars_per_token: 3.5  # chunk-size estimate (chars per token)
  # max_chunks: 6         # cap on HTML chunks per healing attempt

email_notifications: false
# Notifications: recipient for email delivery (SMTP creds live in .env)
# notify_email_to: "you@example.com"

# Alert routing (spec: docs/spec-alert-triage.md). email_notifications above is
# the master switch; these decide which events reach the client and the operator.
alerting:
  client_email: transitions   # transitions|all|off|manual
  operator_webhook: all       # all|transitions|off
  confirm_failures: true      # re-run a failed test once before alerting
  confirm_delay_s: 30         # how long to wait before that re-run
