[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitedetective"
version = "0.1.0"
description = "Local, self-healing E2E test suite for any website"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "SQLAlchemy>=2.0",
    "playwright>=1.45",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sitedetective = "app.main:serve"

[tool.setuptools]
packages = ["app", "app.runner", "app.reports", "app.web"]
